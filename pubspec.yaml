name: cookify
description: Website resep olahan buah
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.0.0
  google_fonts: ^6.1.0 
  image_picker: ^1.0.5
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  provider: ^6.1.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/fruits/
    - assets/images/recipes/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700